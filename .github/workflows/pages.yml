name: Publicar PWA en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund && npm run build
      - name: Preparar ficheros web de producción
        run: |
          mkdir -p _site
          cp iron_helm_game/index.html iron_helm_game/manifest.webmanifest iron_helm_game/sw.js iron_helm_game/pwa-assets.json iron_helm_game/app.bundle.js _site/
          cp -r iron_helm_game/css iron_helm_game/fonts iron_helm_game/icons iron_helm_game/assets _site/
          touch _site/.nojekyll
      - name: Publicar en rama gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: PWA ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
